[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gtm-ai"
version = "0.1.0"
description = "GTM AI Agent System — LangGraph supervisor with 5 specialized agents"
requires-python = ">=3.11"
dependencies = [
    # LangGraph / LangChain
    "langgraph>=0.2",
    "langgraph-supervisor>=0.0.7",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-anthropic>=0.3",
    "langchain-core>=0.3",
    # FastAPI
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.1",
    "httpx>=0.28",
    # Database
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.14",
    # Integrations
    "hubspot-api-client>=10",
    "simple-salesforce>=1.12",
    "google-api-python-client>=2.154",
    "google-auth-httplib2>=0.2",
    "google-auth-oauthlib>=1.2",
    "posthog>=3.7",
    # Observability
    "langfuse>=2.0",
    # Config / Utilities
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-requests",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
